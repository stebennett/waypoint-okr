version: '3.8'

services:
  okr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okr-app
    pull_policy: never
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/okr.db
      NODE_ENV: production
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/quarters"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
